name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: |
          set +e
          python -m pytest -q --tb=short > pytest-out.txt 2>&1
          code=$?
          set -e
          cat pytest-out.txt
          if [ "$code" -ne 0 ]; then
            python -c "import pathlib; text=pathlib.Path('pytest-out.txt').read_text(errors='replace')[-3500:]; text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'); print('::error::'+text)"
          fi
          exit "$code"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build
